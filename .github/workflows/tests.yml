# Run the test suite on every push to main and every pull request.
#
# docker-publish.yml only runs tests when a v*.*.* tag is pushed, so a broken
# commit on main used to surface only at release time — and the predictor /
# backtest tests never ran in CI at all until a release happened to carry
# them. This closes that gap. Python matches the image (python:3.11-slim).
name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . -r requirements-dev.txt
      - name: Test
        run: python -m pytest tests -q
