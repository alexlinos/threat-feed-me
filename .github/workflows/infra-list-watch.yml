# Daily watch of the upstream application-list sources, and the factory for
# the application catalog built from them.
#
# Why: installs read the catalog this job publishes (vendor allow-lists for
# AWS, Microsoft 365, Google, Azure, Cloudflare, GitHub), so this is the
# early warning for a poisoned or reshaped vendor file. Snapshots and the
# catalog live on the orphan branch `infra-snapshots`: change history is
# `git log infra-snapshots` and the diff of any commit is the vendor's diff.
# An alert issue opens on suspicious movement (over the change threshold, or
# a CIDR wider than the prefix floor); a source that could not be fetched or
# parsed keeps its last snapshot and turns the run red.
name: Infra list watch

on:
  schedule:
    - cron: "17 6 * * *"   # daily, off the hour
  workflow_dispatch:        # manual re-run while iterating on sources

permissions:
  contents: write    # commit snapshots to the orphan branch
  issues: write      # open the alert issue

# Two runs at once (the schedule plus a manual dispatch) would both push to
# infra-snapshots and the second push would be rejected. Queue, never cancel:
# a cancelled run could stop between writing snapshots and committing them.
concurrency:
  group: infra-list-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c constraints.txt

      - name: Attach snapshot branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code origin infra-snapshots >/dev/null 2>&1; then
            git fetch origin infra-snapshots
            git branch -f infra-snapshots FETCH_HEAD
          else
            # Bootstrap: orphan branch with one empty-tree commit so it can
            # be checked out as a worktree.
            git checkout --orphan infra-snapshots
            git rm -rf . >/dev/null 2>&1 || true
            git commit -q --allow-empty -m "infra-watch: init snapshot branch"
            git checkout -q main
          fi
          git worktree add .snaps infra-snapshots

      - name: Watch sources
        id: watch
        # The script's exit code is the verdict (1 = suspicious change,
        # 2 = a source failed), read by the alert and fail steps below. It
        # must not end this step: the default shell is `bash -e`, and with
        # pipefail a non-zero exit used to stop the step before the code was
        # recorded, so no alert issue could ever open.
        run: |
          set +e
          python scripts/infra_watch.py --snapshots .snaps/snapshots --update | tee watch.log
          echo "exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Build application catalog
        # Slice the snapshots into finished lists + catalog.json (issue
        # #28). Runs even when the watch alerted: a big upstream change is
        # exactly when the published catalog should still be coherent.
        run: |
          python scripts/build_catalog.py --snapshots .snaps/snapshots --out .snaps/catalog

      - name: Commit changed snapshots
        run: |
          cd .snaps
          git add -A snapshots catalog
          if ! git diff --cached --quiet; then
            git commit -m "infra-watch: $(date -u +%F) snapshot refresh"
            git push origin HEAD:infra-snapshots
          fi

      - name: Report
        if: always()
        run: cat .snaps/snapshots/report.md 2>/dev/null || cat watch.log || true

      - name: Open alert issue
        # Only a real verdict of "suspicious" opens an issue; fetch failures
        # are the red run below. One open alert at a time: reuse the
        # existing one rather than spamming during a multi-day vendor churn.
        if: steps.watch.outputs.exit == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create infra-watch --color B60205 \
            --description "Suspicious upstream change to an application-list source" --force
          TITLE="Infra list watch: suspicious change ($(date -u +%F))"
          EXISTING=$(gh issue list --label infra-watch --state open --json number -q '.[0].number' || true)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body-file .snaps/snapshots/report.md
          else
            gh issue create --title "$TITLE" --label infra-watch \
              --body-file .snaps/snapshots/report.md
          fi

      - name: Fail on a source that could not be read
        # Last, so the snapshots that did succeed are already committed and
        # the catalog is rebuilt. Anything but 0 or 1 lands here too (a
        # crashed script must not look like a clean run).
        if: steps.watch.outputs.exit != '0' && steps.watch.outputs.exit != '1'
        run: |
          echo "infra_watch exited ${{ steps.watch.outputs.exit }}: see the report above" >&2
          exit 1
