# Threat Feed Me! Configuration
#
# Default feed lineup is a curated set of free, keyless block lists suitable
# for a small-org firewall. Talos is self-hosted via a Snort.org scraper.
#
# Feeds are seeded into the DB on first import. After that the DB is
# authoritative — edit feeds from the dashboard.
#
# Reputation is earned, not assumed: every feed starts at the same weight
# (1.0), and flagging false positives from the dashboard automatically lowers
# the offending feed's reputation so its IPs score lower. You can still pin a
# per-feed starting weight (weight: 0.0-1.0) if you have a measured reason to.

feeds:
  # --- Talos (Snort.org IP block list, self-hosted via scraper) ----------
  # The scraper navigates Snort.org's CSRF-protected terms form; the POST
  # response body IS the raw IP list. No conditional GET support (Snort.org
  # doesn't provide ETags for this endpoint).
  - name: talos_snort
    url: https://snort.org/downloads/ip-block-list/terms
    feed_type: "threat_intel"
    update_interval: 86400  # 24 hours — Snort list updates ~daily
    scraper: talos_snort

  # --- Emerging Threats (compromised hosts, ~12h update) -----------------
  - name: emerging_threats_compromised
    url: https://rules.emergingthreats.net/blockrules/compromised-ips.txt
    feed_type: "threat_intel"
    update_interval: 43200  # 12 hours

  # --- Emerging Threats (firewall block IPs) -----------------------------
  # NOTE: this list aggregates other sources (Spamhaus DROP, DShield), so
  # agreement between it and those feeds is not fully independent evidence.
  - name: emerging_threats_block
    url: https://rules.emergingthreats.net/fwrules/emerging-Block-IPs.txt
    feed_type: "threat_intel"
    update_interval: 43200  # 12 hours

  # --- BBcan177 Malicious IPs (GitHub gist, community-maintained) --------
  # NOTE: also an aggregation of other public lists (see the gist), so the
  # same partial-independence caveat as emerging_threats_block applies.
  - name: bbcan177
    url: https://gist.githubusercontent.com/BBcan177/bf29d47ea04391cb3eb0/raw/
    feed_type: "threat_intel"
    update_interval: 3600

  # --- Blocklist.de (SSH/FTP/mail/web attackers, fail2ban reporters) -----
  - name: blocklist_de
    url: https://lists.blocklist.de/lists/all.txt
    feed_type: "threat_intel"
    update_interval: 3600

  # --- CI Army (CINSscore — actively-attacking IPs, poor rogue score) ---
  - name: cins_army
    url: https://cinsscore.com/list/ci-badguys.txt
    feed_type: "threat_intel"
    update_interval: 3600

  # --- Domain feeds (kind='domain'; served under /feeds/domains/*) ------
  # Domains are stored in the existing ip column with kind='domain' (D1);
  # feeds DECLARE indicator_kind='domain' rather than us sniffing domains
  # out of IP feeds (D8). Defaults per ratification: urlhaus + openphish +
  # hagezi ON (keyless = the product promise), joewein OFF (spam-centric,
  # low volume, no embedded freshness header).
  - name: urlhaus_hostfile
    url: https://urlhaus.abuse.ch/downloads/hostfile/
    feed_type: "threat_intel"
    indicator_kind: "domain"
    update_interval: 3600

  - name: openphish_community
    url: https://openphish.com/feed.txt
    feed_type: "threat_intel"
    indicator_kind: "domain"
    update_interval: 900

  # HaGeZi's Threat Intelligence Feeds, MINI variant. The design-doc URL
  # (domain/threat-intelligence.txt) 404s — the list lives under wildcard/
  # as *-onlydomains.txt. Variant sizes (2026-08): full 2.0M entries,
  # medium 386k, mini 167k. Full/medium would dwarf the entire IP corpus
  # and blow the small-deployment memory envelope (the rescorer walks every
  # indicator), so the shipped default is the mini ("most important
  # threats", published for weak devices). Operators with headroom can
  # point the URL at tif.medium-/tif-onlydomains.txt from the dashboard.
  - name: hagezi_threat_intel
    url: https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/tif.mini-onlydomains.txt
    feed_type: "threat_intel"
    indicator_kind: "domain"
    update_interval: 43200  # list header says "Expires: 12 hours"

  # Phishing Army EXTENDED (ratified 2026-08-15). The community-consensus
  # phishing list (Firebog ticked tier): aggregates PhishTank + urlscan.io +
  # Phishunt + OpenPhish + CERT.PL — the first three otherwise key-walled —
  # and scrubs false positives against curated whitelists upstream. Overlap
  # with openphish_community is by design (openphish refreshes 15-min, this
  # 6-hourly); the discounting prices their agreement. CC BY 4.0.
  - name: phishing_army
    url: https://phishing.army/download/phishing_army_blocklist_extended.txt
    feed_type: "phishing"
    indicator_kind: "domain"
    update_interval: 21600  # regenerated every ~6 hours

  # HaGeZi Fake list: fake shops / scam traps. Ratified ON 2026-08-15, then
  # live-measured 100% CONTAINED in hagezi_threat_intel (TIF aggregates
  # hagezi's own Fake list) — 16,626 entries, 0% unique, twin-flagged. Same
  # publisher means the "agreement" isn't independent evidence either, so
  # it ships OFF: only useful if you disable TIF but still want fake-shop
  # coverage.
  - name: hagezi_fake
    url: https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/fake-onlydomains.txt
    feed_type: "threat_intel"
    indicator_kind: "domain"
    enabled: false
    update_interval: 43200

  # CERT Polska warning list: the highest-provenance source in this space
  # (a national CERT, hourly updates), but it is an UPSTREAM of
  # phishing_army — enabling both twin-flags it as ~100% contained. Ships
  # OFF as the provenance-pure alternative for operators who prefer the
  # primary source over the aggregate.
  - name: cert_pl
    url: https://hole.cert.pl/domains/v2/domains.txt
    feed_type: "phishing"
    indicator_kind: "domain"
    enabled: false
    update_interval: 3600

  # ThreatView.io high-confidence domains: ~500k entries (would triple the
  # domain corpus alone), aggregator-of-aggregators provenance, daily
  # updates. OFF: opt-in for large deployments that want the widest net.
  - name: threatview_domains
    url: https://threatview.io/Downloads/DOMAIN-High-Confidence-Feed.txt
    feed_type: "threat_intel"
    indicator_kind: "domain"
    enabled: false
    update_interval: 86400

  - name: joewein_dom_bl
    url: https://www.joewein.net/dl/bl/dom-bl.txt
    feed_type: "threat_intel"
    indicator_kind: "domain"
    enabled: false
    update_interval: 86400

  # drb-ra C2IntelFeeds (ratified 2026-08-20): Cobalt Strike / C2 domains —
  # a threat class no other domain feed covers (IP-side C2 is Feodo/ThreatFox).
  # The filter-abused 30-day variant excludes legitimate fronted/CDN domains
  # (blocking a raw fronted domain would block the CDN); small (~100) but
  # every entry is a live C2. CSV "#domain,ioc" -> drb_ra_domains scraper.
  - name: drb_ra_c2
    url: https://raw.githubusercontent.com/drb-ra/C2IntelFeeds/master/feeds/domainC2s-30day-filter-abused.csv
    feed_type: "threat_intel"
    indicator_kind: "domain"
    update_interval: 3600
    scraper: drb_ra_domains

  # Phishunt (ratified 2026-08-20): live phishing URLs, keyless, small (~700)
  # and fresh. An upstream of phishing_army — same freshness rationale as
  # openphish (primary updates continuously; the aggregate is 6-hourly), and
  # the overlap discounting prices the agreement.
  - name: phishunt
    url: https://phishunt.io/feed.txt
    feed_type: "phishing"
    indicator_kind: "domain"
    update_interval: 3600

  # PhishTank verified+online phishing URLs (ratified 2026-08-20). KEYLESS
  # despite older notes calling it key-walled (live-probed: the public
  # online-valid.csv downloads without a key; follow redirects). ~70k URLs.
  # Ships OFF for the same reason as cert_pl: it is an upstream of
  # phishing_army, so enabling both twin-flags it as largely contained —
  # the provenance-pure alternative for operators preferring the primary.
  # CSV "phish_id,url,..." -> phishtank_urls scraper.
  - name: phishtank_online_valid
    url: https://data.phishtank.com/data/online-valid.csv
    feed_type: "phishing"
    indicator_kind: "domain"
    enabled: false
    update_interval: 3600
    scraper: phishtank_urls

  # --- DShield / SANS ISC recommended block list (top attacking /24s) ----
  # Netblock-shaped: rows are start/end/mask, rewritten to CIDR by the
  # dshield_block scraper so the real /24 prefixes drive overlap scoring.
  # The 30-minute interval + conditional GET (mostly 304s) approximates
  # FireHOL's dshield_1d, which is this same list polled frequently with a
  # rolling 1-day union — our 30-day retention keeps blocks that rotate out
  # of the top-20, so the union accumulates here too.
  # NOTE: emerging_threats_block also incorporates DShield data — agreement
  # between the two is not fully independent evidence.
  - name: dshield_block
    url: https://www.dshield.org/block.txt
    feed_type: "threat_intel"
    update_interval: 1800
    scraper: dshield_block

  # --- Spamhaus DROP (hijacked/leased netblocks, netblock-shaped) --------
  # Also partially incorporated by emerging_threats_block (see note there).
  - name: spamhaus_drop
    url: https://www.spamhaus.org/drop/drop.txt
    feed_type: "spam"
    update_interval: 7200

  # --- bsdly.net greytrap (ratified 2026-08-20) ---------------------------
  # Peter Hansteen's SMTP greytrapping + bruteforce trap list: small (~600),
  # hourly, and genuinely independent — trap-caught senders, not a
  # republication of other rosters. Comment header ignored by the IP parser.
  - name: bsdly_traplist
    url: https://www.bsdly.net/~peter/bsdly.net.traplist
    feed_type: "spam"
    update_interval: 3600

  # --- GreenSnow (multi-service attack sensors) --------------------------
  - name: greensnow
    url: https://blocklist.greensnow.co/greensnow.txt
    feed_type: "threat_intel"
    update_interval: 3600

  # --- DataPlane.org (SSH password-auth attackers, sensor network) -------
  - name: dataplane_sshpwauth
    url: https://dataplane.org/sshpwauth.txt
    feed_type: "threat_intel"
    update_interval: 3600

  # --- BruteForceBlocker (danger.rulez.sk — SSH brute-force reporters) ---
  - name: bruteforceblocker
    url: https://danger.rulez.sk/projects/bruteforceblocker/blist.php
    feed_type: "threat_intel"
    update_interval: 3600

  # --- Turris Sentinel greylist (CZ.NIC router telemetry) ----------------
  - name: turris_greylist
    url: https://view.sentinel.turris.cz/greylist-data/greylist-latest.csv
    feed_type: "threat_intel"
    update_interval: 86400  # published daily

  # --- Binary Defense Artillery banlist (public use only, no resale) -----
  - name: binarydefense
    url: https://binarydefense.com/banlist.txt
    feed_type: "threat_intel"
    update_interval: 86400

  # --- ThreatFox IPs (abuse.ch, via elliotwutingfeng keyless mirror) -----
  # abuse.ch's own ThreatFox export now requires an Auth-Key; this GitHub
  # mirror republishes the same IOC IPs keyless. Malware/botnet C2 — mainly
  # egress value (catches an internal host beaconing out), distinct from the
  # inbound scanner feeds. Supersedes the auth-walled
  # abuse_ch_threatfox entry below, which stays disabled for reference.
  - name: threatfox_mirror
    url: https://raw.githubusercontent.com/elliotwutingfeng/ThreatFox-IOC-IPs/refs/heads/main/ips.txt
    feed_type: "malware"
    update_interval: 3600

  # --- AbuseIPDB 100%-confidence, 3-day window (borestad keyless mirror) --
  # AbuseIPDB's own API is key-gated with small free quotas; this mirror
  # republishes the top-reported IPs (README: "with permission", with
  # attribution) hourly. Its reporting community is large and mostly disjoint
  # from the sensor feeds above, so it corroborates independently. The mirror
  # repo ships no license file — permission is documented in its README only;
  # we consume (poll) the list, we don't redistribute the repo.
  - name: abuseipdb_s100_3d
    url: https://raw.githubusercontent.com/borestad/blocklist-abuseipdb/main/abuseipdb-s100-3d.ipv4
    feed_type: "threat_intel"
    update_interval: 3600  # mirror refreshes ~hourly

  # --- Retired feeds kept for reference (disabled) -----------------------
  # Feodo and SSLBL were removed 2026-08: abuse.ch key-walled its platforms
  # and the legacy text exports froze (SSLBL empty since 2025-01, Feodo one
  # stale IP since 2026-03). The ThreatFox mirror above is the live
  # replacement for abuse.ch botnet-C2 coverage.
  - name: abuse_ch_threatfox
    url: https://threatfox.abuse.ch/export/csv/ip-port/recent/
    feed_type: "malware"
    update_interval: 3600
    enabled: false

  # ---- Opt-in feeds (disabled, need setup) -----------------------------
  # Exports the IPv4 indicators from the OTX pulses your account subscribes
  # to. Requires a (free) OTX account: set OTX_API_KEY and enable from the
  # dashboard. Without subscribed pulses the export is empty.
  - name: alienVault_otx
    url: https://otx.alienvault.com/api/v1/pulses/subscribed/?limit=50
    feed_type: "threat_intel"
    update_interval: 3600
    requires_auth: true
    auth_env: OTX_API_KEY
    auth_header: X-OTX-API-KEY
    scraper: otx_pulses
    enabled: false

  # --- HoneyDB (honeypot sensor network; requires free API credentials) --
  # Community bad hosts seen in the LAST 24 HOURS — a rolling window, so
  # retention accumulates the union across hourly fetches (dshield pattern).
  # Auth is two headers (API id + key), which the generic single-var auth
  # can't express — the honeydb scraper reads HONEYDB_API_ID and
  # HONEYDB_API_KEY and builds both headers itself. The dashboard's Set key
  # button prompts for each. Community quota: 1,000 requests/day; hourly
  # refresh uses 24.
  - name: honeydb_bad_hosts
    url: https://honeydb.io/api/bad-hosts
    feed_type: "threat_intel"
    update_interval: 3600
    requires_auth: true
    auth_env: HONEYDB_API_ID,HONEYDB_API_KEY
    scraper: honeydb
    enabled: false

  # Only hosts seen by sensors THIS account operates — your own honeypots
  # voting as a source. Overlap discounting prices its correlation with the
  # community feed honestly, so enabling both is safe. Often legitimately
  # empty (treated as "no new data", never an error).
  - name: honeydb_mydata
    url: https://honeydb.io/api/bad-hosts/mydata
    feed_type: "threat_intel"
    update_interval: 3600
    requires_auth: true
    auth_env: HONEYDB_API_ID,HONEYDB_API_KEY
    scraper: honeydb
    enabled: false

  - name: custom_honeypot
    url: ./sample_honeypot_ips.txt
    feed_type: "custom"
    update_interval: 3600
    enabled: false
    local_file: true

safety:
  # Guardrails so an operator can't accidentally hand their firewall something
  # that would break their own network. Applied when feeds are ingested and
  # when an IP is added by hand.
  #
  # Drop private/internal and reserved/bogon addresses (RFC1918 10/8,
  # 172.16/12, 192.168/16, loopback, link-local, CGNAT 100.64/10, multicast,
  # etc.). Set false only if you deliberately track internal indicators.
  drop_private_reserved: true
  # Never block well-known public infrastructure (Google/Cloudflare/Quad9/OpenDNS
  # DNS resolvers, etc.) even if a feed lists it. Blocking these breaks name
  # resolution for the whole site.
  protect_known_good: true
  # Optional: extra IPs to always protect (your gateway, DNS, mail relay, ...).
  # known_good:
  #   - 203.0.113.10
  #
  # Domain feeds get the same floor: a core list of OS-update/CDN/mail
  # infrastructure is always protected (with all subdomains), and special-use
  # TLDs (.test .example .invalid .localhost .local .onion) are always
  # rejected. Add YOUR OWN domains here — a feed listing your mail server
  # must never reach your firewall.
  # known_good_domains:
  #   - yourcompany.example.org
  #
  # Remote feed URLs whose host resolves to a private/internal address are
  # refused (SSRF guard: a dashboard user could otherwise point a "feed" at
  # cloud metadata services or internal hosts). Set true only if you fetch
  # feeds from servers on your own network (e.g. an internal honeypot).
  allow_private_feed_urls: false

scoring:
  # How indicators are bucketed into High/Medium/Low.
  #
  # effective_votes (default): a raw source count treats every feed as an
  # independent witness, but public feeds aggregate each other and share
  # reporter communities — adding feeds inflates counts without adding
  # evidence. Instead, each reporting source's vote is discounted by its
  # measured overlap with sources already counted (a feed that 100%-overlaps
  # another adds ~0), and the tier boundaries are found from the resulting
  # vote distribution itself (natural breaks / 1-D k-means at every rescore),
  # never below the floors here. The floors are the only fixed constants and
  # they are semantic, not tuned: medium requires strictly more than one
  # independent witness, high strictly more than two.
  #
  # method: legacy restores the fixed min_sources/min_score gates below.
  tiering:
    method: effective_votes
    medium_floor: 1.1
    high_floor: 2.0

  # Confidence tier thresholds (used when tiering.method: legacy; the
  # require_threat_intel gate applies to BOTH methods)
  high_confidence:
    min_sources: 3
    min_score: 0.75
    # Additionally require at least one curated external feed (any feed_type
    # except "custom") among the sources: an IP known only from custom
    # uploads, local lists, or manual adds tops out at medium.
    require_threat_intel: true
    # Domain HIGH is provenance-first: a domain reported by any feed listed
    # here is high-confidence on that feed's word alone. Domain blocklists
    # aggregate each other, so the overlap-discounted vote count collapses
    # their consensus toward one witness and votes alone can't reach HIGH;
    # WHO reported a domain is the honest signal. List only primary curators
    # (not aggregators): urlhaus is abuse.ch's curated malware-distribution
    # list; cert_pl is a national CERT (ships disabled — listing it here
    # simply takes effect if you enable it). A tier-scoped whitelist entry
    # excludes a false positive from HIGH without dropping it entirely.
    authoritative_domain_feeds:
      - urlhaus_hostfile
      - cert_pl

  medium_confidence:
    min_sources: 2
    min_score: 0.5

  low_confidence:
    min_sources: 1
    min_score: 0.0

  # Score calculation weights. These are normalized to sum to 1.0 at runtime,
  # so the final score always spans the full 0.0-1.0 range regardless of the
  # raw values below.
  source_weight: 0.45
  reputation_weight: 0.33
  recency_weight: 0.22

  # Age decay (scores decrease over time)
  decay_half_life_hours: 72  # Score halves every 3 days

output:
  base_dir: ./output
  formats:
    - text
    - csv
    - json

integrations:
  # UniFi gateways (UDM / UDM Pro / UDM SE / Cloud Gateway) cannot poll an
  # external blocklist URL, so this PUSHES the chosen tier into firewall
  # groups named {group_prefix}-{tier}-1..N via the gateway's local API
  # after every refresh (and on demand: python -m threatfeedme.main
  # --push-unifi). Reference the groups once in a drop rule; membership
  # then maintains itself. Credentials come from UNIFI_USER /
  # UNIFI_PASSWORD env vars (the data-volume .env works) — use a dedicated
  # local-only admin restricted to the Network app.
  unifi:
    enabled: false
    # host: https://192.168.1.1
    site: default
    # Which cumulative tier to push. high (default) is the cleanest list
    # and fits in one group; medium is ~2-4 groups. NEVER point this at
    # low/"everything" on a home gateway.
    tier: high
    # Optionally ALSO push a domain tier into Domain-type network lists
    # ({group_prefix}-dom-{tier}-1..N) — same firewall-group API as the IP
    # arm, no CyberSecure required; reference the lists in a Block policy
    # like the IP ones. Empty = off.
    domain_tier: ""
    group_prefix: threatfeedme
    # UDM certs are self-signed; enable only if yours has a real cert.
    verify_ssl: false
    # Safety rails: groups cap out around ~10k members on UniFi OS, so the
    # set is chunked; the total cap keeps a huge tier from wedging a home
    # gateway (strongest indicators are kept, the log reports any drop).
    max_per_group: 5000
    max_entries: 50000

retention:
  # How long an IP is kept after it was last seen in ANY feed. Because last_seen
  # is refreshed whenever any feed re-reports an IP, this mainly evicts transient
  # high-churn entries (scanners, brute-force) while continuously-listed feeds
  # (Spamhaus, Talos, ...) are effectively immune. 0 = keep forever.
  #
  # This is the seed default only. The live value is editable at runtime from the
  # dashboard (Feeds toolbar) and stored in the DB, which then takes precedence.
  max_age_days: 7

database:
  path: ./data/threatfeedme.db
  backup:
    enabled: true
    interval_hours: 24
    keep: 7
    dir: ./data/backups

dashboard:
# host/port apply when running `python -m threatfeedme.main --serve` directly.
# The Docker entrypoint forces 0.0.0.0 via ENV DASHBOARD_HOST=0.0.0.0 (so
# firewalls can poll the feed URLs); these values only affect source runs.
  host: 127.0.0.1
  port: 8080
  auth_required: false
