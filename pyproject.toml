[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "threat-feed-me"
version = "2.4.4"
description = "Threat Feed Me!: a threat feed aggregator with a firewall-facing dashboard."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Alex Linos", email = "alexlinos@proton.me" }]
requires-python = ">=3.11"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Security",
]
dependencies = [
    "requests==2.33.0",
    "idna==3.15",
    "pyyaml==6.0.3",
    "fastapi==0.133.1",
    "jinja2==3.1.6",
    "uvicorn==0.41.0",
    "python-multipart==0.0.27",
    "pydantic==2.13.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# geo/*.geo1 is the offline country table. Without it here a non-editable
# install (pip install . / wheel) silently ships without geo data.
threatfeedme = ["templates/*", "static/*", "geo/*.geo1"]
