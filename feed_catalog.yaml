# Threat Feed Me remote feed catalog (issue #9).
#
# Installs with the catalog enabled (the default) fetch this file once a day
# from main and merge it with the same rules as the feeds baked into the
# image: a new entry is added (as *pending* review unless the operator turned
# auto-add on), a changed URL/scraper/auth/type reaches every feed the
# operator never edited, an operator delete or Dismiss stays deleted, and
# enabled/weight are never changed here. A feed needing a key always arrives
# disabled.
#
# To change the roster: edit the entries below AND bump catalog_version.
# An unchanged or lower version is ignored, so a forgotten bump is a silent
# no-op. Every entry is validated like a config.yaml feed; an empty list is
# refused. An entry may only name an API key variable that config.yaml already
# declares (a new key's allowed host is a release decision). Mirror changes into config.yaml's feeds: so fresh air-gapped
# installs get them too (tests/test_catalog.py checks the two agree).

catalog_version: 2
feeds:
- name: talos_snort
  url: https://snort.org/downloads/ip-block-list/terms
  feed_type: threat_intel
  update_interval: 86400
  scraper: talos_snort
- name: emerging_threats_compromised
  url: https://rules.emergingthreats.net/blockrules/compromised-ips.txt
  feed_type: threat_intel
  update_interval: 43200
- name: emerging_threats_block
  url: https://rules.emergingthreats.net/fwrules/emerging-Block-IPs.txt
  feed_type: threat_intel
  update_interval: 43200
- name: bbcan177
