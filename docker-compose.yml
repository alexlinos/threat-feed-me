# Turnkey deploy — build from source:  docker compose up -d   then open http://<server>:8080
# Or run the published image without building:  docker compose pull && docker compose up -d
services:
  threat-feed-me:
    # 'image' is both what a local build is tagged as and what `docker compose pull` fetches
    # from Docker Hub; 'build: .' is kept so the repo still builds from source on demand.
    image: alexlinos/threat-feed-me:latest
    build: .
    container_name: threat-feed-me
    ports:
      - "8080:8080"
    volumes:
      - threat-data:/app/data
      - threat-output:/app/output
      # Optional: use YOUR config.yaml instead of the one baked into the image
      # (needed for scoring/safety/known-good-domain edits when you run the
      # published image). Uncomment ONLY if ./config.yaml exists next to this
      # file — if it doesn't, Docker creates an empty directory by that name
      # and the app can't start.
      # - ./config.yaml:/app/config.yaml:ro
    environment:
      # Optional. Leave blank for the out-of-box free feeds. For keyed feeds
      # (e.g. AlienVault OTX) the easiest path is the dashboard's "Set key"
      # button, which stores the key in the data volume's .env. Setting the
      # variable here instead also works and takes precedence on restart.
      # Bare names pass the variable through ONLY when set on the host —
      # the `${VAR:-}` form injected empty strings that masked dashboard-saved
      # keys on the data volume (an empty env var shadowed the real key).
      - OTX_API_KEY
      - HONEYDB_API_ID
      - HONEYDB_API_KEY
      # Optional dashboard Basic auth. Setting BOTH turns auth on (leave both
      # unset to keep the dashboard open on a trusted LAN). Feed URLs stay
      # open either way so firewalls can poll them. Set these here or in the
      # host environment — never in the data-volume .env, which is ignored for
      # dashboard credentials.
      - DASHBOARD_USER
      - DASHBOARD_PASSWORD
      # Optional: hostnames the DASHBOARD may be reached by, comma-separated
      # (e.g. threatfeedme.corp.example). Blocks DNS-rebinding attacks. When
      # unset the dashboard answers to any name and shows which names reached
      # it, with a one-click lock. The server's IP always works, and feed URLs
      # (/feeds/...) are never checked.
      - TFM_ALLOWED_HOSTS
    restart: unless-stopped
    # Small-box hosts (Synology/QNAP NAS, Raspberry Pi): cap the container so
    # a rescore/export burst can never starve the rest of the box. v1.8.3+
    # streams its heavy paths and runs comfortably inside this. See
    # "Small-box deployments" in the README.
    # mem_limit: 1g
    healthcheck:
      # Probe /healthz: constant-cost and unauthenticated. This block
      # OVERRIDES the image's HEALTHCHECK, so it must be kept in sync with
      # the Dockerfile. Never probe a feed URL here — /feeds/all.txt grows
      # with the corpus and eventually outlives the probe timeout, marking
      # healthy deployments permanently unhealthy.
      test: ["CMD", "python", "-c", "import socket,requests,sys; ip=socket.gethostbyname(socket.gethostname()); sys.exit(0 if requests.get('http://'+ip+':8080/healthz', timeout=5).ok else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  threat-data:
    name: threatfeedme-data
  threat-output:
    name: threatfeedme-output

networks:
  default:
    name: threatfeedme-network
